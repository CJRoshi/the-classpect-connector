    /* --- Hint stage --- */
    .hint-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px 0 10px;
    }
    /* The art row holds the libra and the speech-bubble art. */
    .hint-art {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .hint-libra {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .hint-libra img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* Speech-bubble art — pinned to the content-box edges. */
    .hint-sidebubble {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 260px;
      max-width: 42%;
      pointer-events: none;
      transition: opacity 160ms ease;
    }
    .hint-sidebubble img { width: 100%; height: auto; display: block; }
    .hint-sidebubble.dave { left:  -20px; }
    .hint-sidebubble.rose { right: -20px; }
    .hint-sidebubble.inactive { opacity: 0; }

    /* Shared text box — matches the regular site look. */
    .hint-bubble {
      background: #d0d0d0;
      color: #000;
      border: 1px solid #888;
      border-radius: 10px;
      padding: 14px 16px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 0.98rem;
      line-height: 1.45;
      min-height: 84px;
      width: 100%;
      max-width: 640px;
    }
    .hint-speaker {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.75;
      margin-bottom: 5px;
    }
    .hint-text { white-space: pre-wrap; }
    /* Inline links in dialogue — picked up from HTML inside each
       beat's `text`. Inherit the speaker's accent color for the
       underline so the link reads as part of the character's line. */
    .hint-text a {
      color: inherit;
      text-decoration: underline;
      font-weight: bold;
    }
    .hint-text a:hover { text-decoration: none; opacity: 0.8; }

    /* Character color pills applied per-speaker. */
    .hint-bubble.terezi { border-color: #008282; }
    .hint-bubble.terezi .hint-text,
    .hint-bubble.terezi .hint-speaker { color: #008282; }
    .hint-bubble.dave   { border-color: #e00707; }
    .hint-bubble.dave   .hint-text,
    .hint-bubble.dave   .hint-speaker { color: #e00707; }
    .hint-bubble.rose   { border-color: #b536da; }
    .hint-bubble.rose   .hint-text,
    .hint-bubble.rose   .hint-speaker { color: #b536da; }

    .hint-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 0 4px;
    }
    /* MSPA-style "==>" advance link */
    .hint-advance {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 1.6rem;
      color: #0000ee;
      text-decoration: underline;
      cursor: pointer;
      user-select: none;
      letter-spacing: 2px;
    }
    .hint-advance:hover { color: #cc0000; }
    .hint-advance.disabled {
      cursor: default;
      pointer-events: none;
      text-decoration: none;
    }
    /* Pesterlog-style closing stamp */
    .hint-closing {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 0.95rem;
      color: #000;

    @media (max-width: 720px) {

      .hint-sidebubble.dave { left:  -20px; }

// Buffer picker — pass BUFFER_SEQUENCES for hint-section pacing,
// COMMENTARY_BUFFERS for post-find pacing. Each call creates its
// own `usedLong` set so long beats never repeat within one script
// run (short one-liners can repeat freely as before).
function makeBufferPicker(pool = BUFFER_SEQUENCES) {
  const shortPool = pool.filter(s => s.length === 1);
  const longPool  = pool.filter(s => s.length  >  1);
  const usedLong  = new Set();
  const pickFrom  = (p) => p[Math.floor(Math.random() * p.length)];
  return function pickBufferSequence() {
    const longsLeft = longPool.filter(s => !usedLong.has(s));
    if (longsLeft.length > 0 && Math.random() < 0.5) {
      const pick = pickFrom(longsLeft);
      usedLong.add(pick);
      return pick;
    }
    return pickFrom(shortPool);
  };
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Max number of already-found secrets to comment on at the end of a
// session. More than this starts to feel like filibustering.
const MAX_POST_FIND_PICKS = 3;

function buildDialogue({ fromPlayground, firstVisit, unlockedSet }) {
  const script = [];
  const push = (seqOrBeat) => Array.isArray(seqOrBeat)
    ? seqOrBeat.forEach(b => script.push(b))
    : script.push(seqOrBeat);
  const pickBuffer = makeBufferPicker();

  // ---- Opening ----------------------------------------------
  if (firstVisit) {
    push(OPENING_FIRST_VISIT);
    if (fromPlayground) push(OPENING_FROM_PLAYGROUND);
  } else {
    push(fromPlayground ? OPENING_FROM_PLAYGROUND : OPENING_DEFAULT);
  }

  // ---- Open-case hints --------------------------------------
  const stillOpen = SECRET_GROUPS.filter(g => !g.keys.some(k => unlockedSet.has(k)));
  const openWithHints = shuffle(
    stillOpen.filter(g => (HINTS_BY_SECRET[g.id] || []).length > 0)
  );
  openWithHints.forEach((g, i) => {
    if (i > 0) pickBuffer().forEach(beat => script.push(beat));
    HINTS_BY_SECRET[g.id].forEach(beat => script.push(beat));
  });

  // Pre-compute whether commentary is going to play — this changes
  // which mid-closing / all-found opener we use so the handoff into
  // commentary actually blends.
  const foundWithPostHints = SECRET_GROUPS
    .filter(g =>  g.keys.some(k => unlockedSet.has(k)))
    .filter(g => (POST_FIND_HINTS[g.id] || []).length > 0);
  const hasCommentary = foundWithPostHints.length > 0;

  // ---- Mid closing (unfound-case) OR all-found opener ------
  if (stillOpen.length > 0) {
    if (openWithHints.length === 0) {
      push({
        speaker: 'terezi',
        text: '... HUH. 1 DON\'T 4CTU4LLY H4V3 4NY H1NTS WR1TT3N FOR TH3 ON3S YOU H4V3N\'T FOUND Y3T. M4YB3 CH3CK B4CK SOON.',
      });
    }
    push(hasCommentary
      ? CLOSING_WITH_UNFOUND_INTO_COMMENTARY
      : CLOSING_WITH_UNFOUND);
    if (hasCommentary) {
      const leadIn = POST_FIND_LEAD_IN[Math.floor(Math.random() * POST_FIND_LEAD_IN.length)];
      push(leadIn);
    }
  } else {
    // All secrets found.
    if (hasCommentary) {
      const allFoundOpener = ALL_FOUND_LEAD_IN[Math.floor(Math.random() * ALL_FOUND_LEAD_IN.length)];
      push(allFoundOpener);
    } else {
      push(CLOSING_ALL_FOUND_NO_COMMENTARY);
    }
  }

  // ---- Commentary picks -------------------------------------
  if (hasCommentary) {
    const picks = shuffle(foundWithPostHints).slice(0, MAX_POST_FIND_PICKS);
    const pickCommentaryBuffer = makeBufferPicker(COMMENTARY_BUFFERS);
    picks.forEach((g, i) => {
      if (i > 0) pickCommentaryBuffer().forEach(beat => script.push(beat));
      const variants = POST_FIND_HINTS[g.id];
      const chosen   = variants[Math.floor(Math.random() * variants.length)];
      push(chosen);
    });

    // ---- Commentary closing (end of commentary section) ------
    push(stillOpen.length > 0
      ? COMMENTARY_CLOSING_WITH_UNFOUND
      : COMMENTARY_CLOSING_ALL_FOUND);
  }

  return script;
}

const HintsPage = () => {
  const fromPlayground = React.useMemo(() => {
    try { return new URLSearchParams(window.location.search).get('from') === 'playground'; }
    catch { return false; }
  }, []);
  const unlockedSet = React.useMemo(() => {
    try { return new Set(JSON.parse(localStorage.getItem('cc_unlocks') || '[]')); }
    catch { return new Set(); }
  }, []);
  // First-ever visit per browser.
  const firstVisit = React.useMemo(() => {
    try {
      const seen = localStorage.getItem('cc_hints_seen') === '1';
      if (!seen) localStorage.setItem('cc_hints_seen', '1');
      return !seen;
    } catch { return false; }
  }, []);
  const script = React.useMemo(
    () => buildDialogue({ fromPlayground, firstVisit, unlockedSet }),
    [fromPlayground, firstVisit, unlockedSet]
  );
  const [idx, setIdx] = React.useState(0);
  const beat    = script[idx] || OPENING_DEFAULT;
  const atEnd   = idx >= script.length - 1;
  const advance = () => { if (!atEnd) setIdx(idx + 1); };

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [idx, atEnd]);

  const isDave = beat.speaker === 'dave';
  const isRose = beat.speaker === 'rose';
  const sp     = SPEAKERS[beat.speaker] || SPEAKERS.terezi;

  return (
    <div className="space-y-4">
      <h1 className="font-typostuck-title text-center">Hints</h1>
      <div className="hint-stage">
        <div className="hint-art">
          <div className="hint-libra">
            <img src="./images/special/biglibra.gif" alt="Terezi"/>
          </div>
          <div className={'hint-sidebubble dave' + (isDave ? '' : ' inactive')}>
            <img src={SPEAKERS.dave.bubbleImg} alt="Dave speech bubble"/>
          </div>
          <div className={'hint-sidebubble rose' + (isRose ? '' : ' inactive')}>
            <img src={SPEAKERS.rose.bubbleImg} alt="Rose speech bubble"/>
          </div>
        </div>

        <div className={'hint-bubble ' + beat.speaker}>
          <div className="hint-speaker">{sp.label}</div>
          {/* `text` is treated as trusted HTML so beats can embed
              inline <a> links (and <em>, <br>, etc.) when a line
              earns one. The content is hard-coded in this file,
              never user-supplied, so dangerouslySetInnerHTML is fine. */}
          <div className="hint-text"
               dangerouslySetInnerHTML={{ __html: beat.text }}/>
        </div>
      </div>

      <div className="hint-controls">
        {atEnd ? (
          <div className="hint-closing">
            -- <span className="is">intrepidScryer [IS]</span> ceased pestering{' '}
            <span className="gc">gallowsCalibrator [GC]</span> --
          </div>
        ) : (
          <a className="hint-advance" onClick={advance} role="button" tabIndex={0}>
            ==&gt;
          </a>
        )}
      </div>
    </div>
  );
};
