    @font-face { font-family: 'Typostuck'; src: url('./fonts/TYPOSTUCK.ttf') format('truetype'); }

    .font-typostuck-header { font-family: 'Typostuck', 'Courier New', monospace; font-size: 1.75rem; }

    /* --- Hint stage --- */
    .hint-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px 0 10px;
    }
    /* The art row holds the libra and the speech-bubble art. */
    .hint-art {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .hint-libra {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .hint-libra img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* Speech-bubble art — pinned to the content-box edges. */
    .hint-sidebubble {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 260px;
      max-width: 42%;
      pointer-events: none;
      transition: opacity 160ms ease;
    }
    .hint-sidebubble img { width: 100%; height: auto; display: block; }
    .hint-sidebubble.dave { left:  -20px; }
    .hint-sidebubble.rose { right: -20px; }
    .hint-sidebubble.inactive { opacity: 0; }

    /* Shared text box — matches the regular site look. */
    .hint-bubble {
      background: #d0d0d0;
      color: #000;
      border: 1px solid #888;
      border-radius: 10px;
      padding: 14px 16px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 0.98rem;
      line-height: 1.45;
      min-height: 84px;
      width: 100%;
      max-width: 640px;
    }
    .hint-speaker {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.75;
      margin-bottom: 5px;
    }
    .hint-text { white-space: pre-wrap; }

    /* Character color pills applied per-speaker. */
    .hint-bubble.terezi { border-color: #008282; }
    .hint-bubble.terezi .hint-text,
    .hint-bubble.terezi .hint-speaker { color: #008282; }
    .hint-bubble.dave   { border-color: #e00707; }
    .hint-bubble.dave   .hint-text,
    .hint-bubble.dave   .hint-speaker { color: #e00707; }
    .hint-bubble.rose   { border-color: #b536da; }
    .hint-bubble.rose   .hint-text,
    .hint-bubble.rose   .hint-speaker { color: #b536da; }

    .hint-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 0 4px;
    }
    /* MSPA-style "==>" advance link */
    .hint-advance {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 1.6rem;
      color: #0000ee;
      text-decoration: underline;
      cursor: pointer;
      user-select: none;
      letter-spacing: 2px;
    }
    .hint-advance:hover { color: #cc0000; }
    .hint-advance.disabled {
      cursor: default;
      pointer-events: none;
      text-decoration: none;
    }
    /* Pesterlog-style closing stamp */
    .hint-closing {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 0.95rem;
      color: #000;
      padding-top: 2px;
    }
    .hint-closing .is { color: #060935; }   /* intrepidScryer stygian blue */
    .hint-closing .gc { color: #008282; }   /* gallowsCalibrator teal */

    /* Mobile CSS */
    @media (max-width: 720px) {
      .hint-sidebubble { width: 210px; max-width: 60%; }
      .hint-sidebubble.dave { left:  -20px; }
      .hint-sidebubble.rose { right: -20px; }
    }
  </style>
</head>

const OPENING_FROM_PLAYGROUND = {
  speaker: 'terezi',
  text: "1F YOU C4N'T 4CC3SS TH4T P4G3 Y3T, 1T M34NS YOU'R3 NOT SUPPOS3D TO, DUMMY! YOU N33D TO B3 MOR3 P3RC3PT1V3 >:]",
};
const ALL_FOUND_LINE = {
  speaker: 'terezi',
  text: "1 C4N'T DO 4NYTH1NG TO H3LP YOU!!! BUT M4YB3 TRY 4G41N L4T3R WH3N TH3R3 4R3 N3W S3CR3TS FOR YOU TO F1ND.",
};
const CLOSING_LINE = {
  speaker: 'terezi',
  text: "TH4T'S 4LL 1 H4V3 FOR NOW!! COM3 B4CK WH3N YOU'V3 FOUND MOR3 OF TH3 ON3S 1 JUST M3NT1ON3D >:]",
};

// Buffer picker
function makeBufferPicker() {
  const shortPool = BUFFER_SEQUENCES.filter(s => s.length === 1);
  const longPool  = BUFFER_SEQUENCES.filter(s => s.length  >  1);
  const usedLong  = new Set();
  const pickFrom  = (pool) => pool[Math.floor(Math.random() * pool.length)];
  return function pickBufferSequence() {
    const longsLeft = longPool.filter(s => !usedLong.has(s));
    // ~50% chance of a longer character beat when any are still
    // available; otherwise fall back to a quick one-liner.
    if (longsLeft.length > 0 && Math.random() < 0.5) {
      const pick = pickFrom(longsLeft);
      usedLong.add(pick);
      return pick;
    }
    return pickFrom(shortPool);
  };
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDialogue({ fromPlayground, unlockedSet }) {
  const script = [];
  script.push(fromPlayground ? OPENING_FROM_PLAYGROUND : OPENING_DEFAULT);

  const stillOpen = SECRET_GROUPS.filter(g => !g.keys.some(k => unlockedSet.has(k)));
  if (stillOpen.length === 0) {
    script.push(ALL_FOUND_LINE);
    return script;
  }

  // Shuffle the hint sequences.
  const openWithHints = shuffle(
    stillOpen.filter(g => (HINTS_BY_SECRET[g.id] || []).length > 0)
  );
  const pickBuffer = makeBufferPicker();
  openWithHints.forEach((g, i) => {
    if (i > 0) pickBuffer().forEach(beat => script.push(beat));
    HINTS_BY_SECRET[g.id].forEach(beat => script.push(beat));
  });

  if (openWithHints.length === 0) {
    script.push({
      speaker: 'terezi',
      text: '... HUH. 1 DON\'T 4CTU4LLY H4V3 4NY H1NTS WR1TT3N FOR TH3 ON3S YOU H4V3N\'T FOUND Y3T. M4YB3 CH3CK B4CK SOON.',
    });
  }

  script.push(CLOSING_LINE);
  return script;
}

/* --------------------------------------------------------------
   HINT UI
   -------------------------------------------------------------- */
const HintsPage = () => {
  const fromPlayground = React.useMemo(() => {
    try { return new URLSearchParams(window.location.search).get('from') === 'playground'; }
    catch { return false; }
  }, []);
  const unlockedSet = React.useMemo(() => {
    try { return new Set(JSON.parse(localStorage.getItem('cc_unlocks') || '[]')); }
    catch { return new Set(); }
  }, []);
  const script = React.useMemo(
    () => buildDialogue({ fromPlayground, unlockedSet }),
    [fromPlayground, unlockedSet]
  );
  const [idx, setIdx] = React.useState(0);
  const beat    = script[idx] || OPENING_DEFAULT;
  const atEnd   = idx >= script.length - 1;
  const advance = () => { if (!atEnd) setIdx(idx + 1); };

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [idx, atEnd]);

  const isDave = beat.speaker === 'dave';
  const isRose = beat.speaker === 'rose';
  const sp     = SPEAKERS[beat.speaker] || SPEAKERS.terezi;

  return (
    <div className="space-y-4">
      <h1 className="font-typostuck-title text-center">Hints</h1>
      <div className="hint-stage">
        <div className="hint-art">
          <div className="hint-libra">
            <img src="./images/special/biglibra.gif" alt="Terezi"/>
          </div>
          <div className={'hint-sidebubble dave' + (isDave ? '' : ' inactive')}>
            <img src={SPEAKERS.dave.bubbleImg} alt="Dave speech bubble"/>
          </div>
          <div className={'hint-sidebubble rose' + (isRose ? '' : ' inactive')}>
            <img src={SPEAKERS.rose.bubbleImg} alt="Rose speech bubble"/>
          </div>
        </div>

        <div className={'hint-bubble ' + beat.speaker}>
          <div className="hint-speaker">{sp.label}</div>
          <div className="hint-text">{beat.text}</div>
        </div>
      </div>

      <div className="hint-controls">
        {atEnd ? (
          <div className="hint-closing">
            -- <span className="is">intrepidScryer [IS]</span> ceased pestering{' '}
            <span className="gc">gallowsCalibrator [GC]</span> --
          </div>
        ) : (
          <a className="hint-advance" onClick={advance} role="button" tabIndex={0}>
            ==&gt;
          </a>
        )}
      </div>
    </div>
  );
};

const App = () => {
  const handleNavigate = (path) => { window.location.href = `./index.html#${path}`; };
  return (
    <div style={{ backgroundColor: defaultTheme.bg, minHeight: '100vh' }}>
      <Header onNavigate={handleNavigate} theme={defaultTheme}/>
      <div className="px-3 sm:px-6 pb-6">
        <div className="max-w-4xl mx-auto">
          <div style={{
            backgroundColor: '#eeeeee',           /* matches biglibra.gif's own bg */
            color: defaultTheme.textColor,
            padding: '20px',
            borderRadius: '8px',
            boxShadow: '0 4px 6px rgba(0,0,0,0.3)',
            border: `2px solid ${defaultTheme.accentBg}`,
          }}>
            <HintsPage/>
          </div>
          <Footer theme={defaultTheme}/>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
