/* -------------------------------------------------------------------
   DOWNLOAD / COPY HELPERS — always use the source file's native format.
   ------------------------------------------------------------------- */
const triggerDownload = (url, filename) => {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};
const copyImageToClipboard = async (url) => {
  // Always copy an IMAGE to the clipboard, never raw text.
  const resp = await fetch(url);
  const blob = await resp.blob();
  const rasterizeToPng = async (sourceBlob) => {
    const objUrl = URL.createObjectURL(sourceBlob);
    try {
      const img = new Image();
      await new Promise((res, rej) => {
        img.onload  = res;
        img.onerror = () => rej(new Error('image decode failed'));
        img.src = objUrl;
      });
      // SVGs loaded via <img> may report 0 naturalWidth if they lack
      // explicit width/height. Fall back to a reasonable default so
      // the canvas has pixels to draw into.
      const w = img.naturalWidth  || 1024;
      const h = img.naturalHeight || 1024;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      return await new Promise((r) => c.toBlob(r, 'image/png'));
    } finally {
      URL.revokeObjectURL(objUrl);
    }
  };
  if (blob.type.includes('svg')) {
    const pngBlob = await rasterizeToPng(blob);
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
    return 'svg-as-png';
  }
  try {
    await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
    return 'image';
  } catch (e) {
    const pngBlob = await rasterizeToPng(blob);
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
    return 'image-png-fallback';
  }
};

/* -------------------------------------------------------------------
   SMALL UI PIECES
   ------------------------------------------------------------------- */
const AssetTile = ({ thumbUrl, label, downloads = [] }) => {
  // `downloads` is [{ ext, src, filename }, ...]. One Save button per
  // extension; a single Copy button that always targets the PNG source
  // when one exists.
  const [copied, setCopied] = React.useState(false);
  const copySrc = downloads.find((d) => d.ext === 'png') || downloads[0];
  const handleCopy = async () => {
    if (!copySrc) return;
    try {
      await copyImageToClipboard(copySrc.src);
      setCopied(true);
      setTimeout(() => setCopied(false), 1200);
    } catch (e) {
      console.error('copy failed', e);
      alert('Copy failed — your browser may not allow image clipboard writes for this file type.');
    }
  };
  return (
    <div className="res-tile">
      <img className="thumb" src={thumbUrl} alt={label} loading="lazy"/>
      <div className="label">{label}</div>
      <div className="row">
        {downloads.map((d) => (
          <button key={d.ext}
                  className="res-btn"
                  onClick={() => triggerDownload(d.src, d.filename)}
                  title={`Save ${d.filename}`}>
            {d.ext.toUpperCase()}
          </button>
        ))}
        {copySrc && (
          <button className={'res-btn' + (copied ? ' copied' : '')}
                  onClick={handleCopy}
                  title={`Copy image to clipboard (as PNG)`}>
            {copied ? '✓' : 'Copy'}
          </button>
        )}
      </div>
    </div>
  );
};

/* FG / BG swatch tile — click either half of the tile to copy its own
   hex. Visually: outer rect = BG color, inner badge = FG color. */
const FgBgSwatch = ({ aspect, fg, bg, onCopy, copiedWhich }) => {
  const fgCopied = copiedWhich === 'fg';
  const bgCopied = copiedWhich === 'bg';
  // Pick label text color based on the FG color's luminance so the
  // aspect name stays readable regardless of which hue dominates.
  const luma = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 0xff, g = (n >> 8) & 0xff, b = n & 0xff;
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  };
  const fgText = luma(fg) > 0.55 ? '#111' : '#fff';
  const bgText = luma(bg) > 0.55 ? '#111' : '#fff';
  return (
    <div
      className="res-fgbg-tile"
      style={{
        display: 'flex', flexDirection: 'column', alignItems: 'stretch',
        border: '2px solid #000', borderRadius: 6, overflow: 'hidden',
        background: bg, color: bgText,
        fontFamily: "'Courier New', monospace", fontSize: '0.78rem',
        boxShadow: '0 1px 3px rgba(0,0,0,0.3)',
      }}
      title="Click a swatch to copy its hex"
    >
      {/* Inner FG badge */}
      <div
        onClick={(e) => { e.stopPropagation(); onCopy(aspect, 'fg', fg); }}
        style={{
          margin: '10px 10px 6px', padding: '8px 6px',
          background: fg, color: fgText,
          borderRadius: 4, textAlign: 'center',
          cursor: 'pointer', lineHeight: 1.25,
          outline: fgCopied ? '2px solid #0f0' : 'none',
        }}
      >
        <div style={{ fontWeight: 'bold' }}>{aspect}</div>
        <div style={{ opacity: 0.95 }}>{fgCopied ? '✓ copied' : fg}</div>
      </div>
      {/* Outer BG hex label */}
      <div
        onClick={(e) => { e.stopPropagation(); onCopy(aspect, 'bg', bg); }}
        style={{
          padding: '4px 8px 8px', textAlign: 'center',
          cursor: 'pointer',
          textShadow: bgText === '#fff' ? '0 1px 1px rgba(0,0,0,0.5)' : 'none',
        }}
      >
        {bgCopied ? '✓ copied' : bg}
      </div>
    </div>
  );
};

const AspectColorsSection = () => {
  // Map from "aspect|which" → true for the swatch most recently copied,
  // auto-cleared after 1.2s. Only ONE swatch highlights at a time so
  // the user sees a clear confirmation on the last click.
  const [copied, setCopied] = React.useState(null);  // { aspect, which }
  const copy = async (aspect, which, hex) => {
    try {
      await navigator.clipboard.writeText(hex);
      setCopied({ aspect, which });
      setTimeout(() => setCopied((c) => (c && c.aspect === aspect && c.which === which) ? null : c), 1200);
    } catch (e) { console.error(e); }
  };
  const Palette = ({ fgTable, bgTable }) => (
    <div>
      <div
        style={{
          display: 'grid',
          gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))',
          gap: 10,
        }}
      >
        {ASPECT_ORDER.map((asp) => {
          const low = asp.toLowerCase();
          const which = copied && copied.aspect === asp ? copied.which : null;
          return (
            <FgBgSwatch key={asp}
              aspect={asp}
              fg={fgTable[low]}
              bg={bgTable[low]}
              onCopy={copy}
              copiedWhich={which}
            />
          );
        })}
      </div>
    </div>
  );
  return (
    <Palette
      fgTable={SPRITE_FG_COLORS}
      bgTable={SPRITE_BG_COLORS}
    />
  );
};

/* -------------------------------------------------------------------
   CLASSPECTS BULK DOWNLOAD
   Mounts 168 ClasspectGlyph instances hidden off-screen, waits for
   each to be ready, then composes a static image per glyph (honoring
   the current ring / outline / thickness / image-format settings) and
   bundles the result as a ZIP.
   ------------------------------------------------------------------- */
const ALL_PAIRS = (() => {
  const out = [];
  for (const cls of CLASS_ORDER) for (const asp of ASPECT_ORDER) {
    out.push({ cls, asp });
  }
  return out;
})();

const ClasspectsSection = () => {
  // Track the image-format setting so the user can preview the current
  // extension/format label before clicking Download.
  const [fmt, setFmt] = React.useState(() => Settings.get('imageExportFormat'));
  React.useEffect(() => {
    const onCh = (ev) => {
      if (ev.detail?.name === 'imageExportFormat') setFmt(Settings.get('imageExportFormat'));
    };
    window.addEventListener('cc-setting-change', onCh);
    return () => window.removeEventListener('cc-setting-change', onCh);
  }, []);
  const fmtLabel = fmt === 'webp' ? 'WebP'
                 : fmt === 'jpg'  ? 'JPG'
                 : fmt === 'svg'  ? 'SVG'
                 :                  'PNG';
  const fmtExt   = fmt === 'webp' ? 'webp'
                 : fmt === 'jpg'  ? 'jpg'
                 : fmt === 'svg'  ? 'svg'
                 :                  'png';

  const [status, setStatus] = React.useState(null);  // null | 'rendering' | 'zipping' | 'done' | 'error'
  const [progress, setProgress] = React.useState({ done: 0, total: ALL_PAIRS.length });
  const [building, setBuilding] = React.useState(false);
  const refs = React.useRef({});

  // Wait until every mounted ClasspectGlyph reports isReady() === true.
  const waitAllReady = async () => {
    const tStart = Date.now();
    while (Date.now() - tStart < 20000) {
      let allOk = true;
      for (const { cls, asp } of ALL_PAIRS) {
        const r = refs.current[`${cls}|${asp}`];
        if (!r || typeof r.isReady !== 'function' || !r.isReady()) { allOk = false; break; }
      }
      if (allOk) return true;
      await new Promise((res) => setTimeout(res, 100));
    }
    return false;
  };

  const handleBuild = async () => {
    setBuilding(true);
    setStatus('rendering');
    setProgress({ done: 0, total: ALL_PAIRS.length });
    // Yield one tick so the hidden glyph grid gets mounted.
    await new Promise((r) => setTimeout(r, 0));
    const ready = await waitAllReady();
    if (!ready) {
      setStatus('error');
      setBuilding(false);
      return;
    }
    setStatus('zipping');
    const zip = new JSZip();
    const used = new Set();
    let done = 0;
    for (const { cls, asp } of ALL_PAIRS) {
      const ref = refs.current[`${cls}|${asp}`];
      try {
        const blob = fmt === 'svg' && typeof ref.composeStaticSvg === 'function'
          ? await ref.composeStaticSvg(1024)
          : await ref.composeStaticPng(1024);
        if (blob) {
          let fname = `${cls.toLowerCase()}-of-${asp.toLowerCase()}.${fmtExt}`;
          let n = 2;
          while (used.has(fname)) fname = `${cls.toLowerCase()}-of-${asp.toLowerCase()}-${n++}.${fmtExt}`;
          used.add(fname);
          zip.file(fname, blob);
        }
      } catch (e) {
        console.warn(`compose failed for ${cls}/${asp}:`, e);
      }
      done += 1;
      setProgress({ done, total: ALL_PAIRS.length });
      // Give the browser a chance to paint the progress bar.
      if (done % 8 === 0) await new Promise((r) => setTimeout(r, 0));
    }
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    triggerDownload(URL.createObjectURL(zipBlob), `classpect-glyphs-${fmtExt}.zip`);
    setStatus('done');
    setBuilding(false);
    setTimeout(() => { setStatus(null); setBuilding(false); }, 2000);
  };

  return (
    <>
      <p className="res-intro">
        All 168 classpects in a ZIP archive. Uses your current glyph settings; format: <b>{fmtLabel}</b>.
      </p>
      <button className="res-btn"
              style={{ fontSize: '0.9rem', padding: '8px 16px' }}
              disabled={building}
              onClick={handleBuild}>
        {building
          ? (status === 'rendering' ? 'Rendering…' : status === 'zipping' ? `Composing ${progress.done}/${progress.total}…` : 'Working…')
          : `Download (ZIP, ${fmtExt.toUpperCase()})`}
      </button>
      {status === 'error' && (
        <div style={{ color: '#a10000', marginTop: 8, fontFamily: "'Courier New', monospace", fontSize: '0.85rem' }}>
          Timed out while loading the glyph assets. Try again — if it keeps happening, check the browser console.
        </div>
      )}
      {building && (
        <div className="res-progress">
          <div className="res-progress-bar" style={{ width: `${Math.round((progress.done / progress.total) * 100)}%` }}/>
        </div>
      )}
      {/* Hidden grid of all 168 glyphs — only mounted while building so
          we don't pay the asset-fetch cost on every page view. */}
      {building && (
        <div style={{
          position: 'fixed', left: '-99999px', top: '-99999px',
          width: 1, height: 1, overflow: 'hidden', visibility: 'hidden',
          pointerEvents: 'none',
        }}>
          {ALL_PAIRS.map(({ cls, asp }) => (
            <ClasspectGlyph
              key={`${cls}|${asp}`}
              ref={(r) => { refs.current[`${cls}|${asp}`] = r; }}
              className={cls}
              aspectName={asp}
              theme={defaultTheme}
              size={240}
              showButtons={false}
              animate={false}
            />
          ))}
        </div>
      )}
    </>
  );
};

/* -------------------------------------------------------------------
   PAGE
   ------------------------------------------------------------------- */
const ResourcesPage = () => (
  <div className="space-y-6">
    <h1 className="font-typostuck-title mb-2 text-center">Resources</h1>

    <Section id="classpects" title="Classpect glyphs (bulk ZIP)"   defaultOpen={true}><ClasspectsSection/></Section>
    <Section id="aspects"    title="Aspect symbols"                defaultOpen={true}><AspectsSection/>   </Section>
    <Section id="classes"    title="Class symbols"                 defaultOpen={true}><ClassesSection/>   </Section>
    <Section id="rings"      title="Class ring silhouettes (SVG)"  defaultOpen={true}><RingsSection/>     </Section>
    <Section id="moons"      title="Moon icons"                    defaultOpen={true}><MoonsSection/>    </Section>
    <Section id="logos"      title="Site logos"                    defaultOpen={true}><LogosSection/>    </Section>
    <Section id="figures"    title="Figures"                       defaultOpen={true}><FiguresSection/>  </Section>
    <Section id="colors"     title="Aspect colors"                 defaultOpen={true}><AspectColorsSection/></Section>
  </div>
);

const App = () => {
  const handleNavigate = (path) => {
    window.location.href = `./index.html#${path}`;
  };
  return (
    <div style={{ backgroundColor: defaultTheme.bg, minHeight: '100vh' }}>
      <Header onNavigate={handleNavigate} theme={defaultTheme} />
      <div className="px-3 sm:px-6 pb-6">
        <div className="max-w-5xl mx-auto">
          <div style={{
            backgroundColor: defaultTheme.contentBg,
            color: defaultTheme.textColor,
            padding: '24px',
            borderRadius: '8px',
            boxShadow: '0 4px 6px rgba(0,0,0,0.3)',
            border: `2px solid ${defaultTheme.accentBg}`,
          }}>
            <ResourcesPage/>
          </div>
          <Footer theme={defaultTheme}/>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
